name: Build ReplayBuffer EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: |
          choco install ffmpeg -y
          ffmpeg -version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller ReplayBuffer.spec

      - name: Bundle ffmpeg into dist
        run: |
          $ffmpegPath = (Get-Command ffmpeg).Source
          Copy-Item $ffmpegPath dist\ffmpeg.exe

      - name: Package into ZIP
        run: |
          Compress-Archive -Path dist\ReplayBuffer.exe, dist\ffmpeg.exe -DestinationPath dist\ReplayBuffer_full.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReplayBuffer-Windows
          path: dist\ReplayBuffer_full.zip
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: "ReplayBuffer v3.0.${{ github.run_number }}"
          body: |
            הורד את ReplayBuffer_full.zip וחלץ את שני הקבצים לאותה תיקייה.
            הפעל ReplayBuffer.exe כמנהל מערכת.
          files: dist\ReplayBuffer_full.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
