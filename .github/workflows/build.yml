name: Build ReplayBuffer EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller ReplayBuffer.spec

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReplayBuffer-Windows
          path: dist/ReplayBuffer.exe
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "ReplayBuffer v2.0.${{ github.run_number }}"
          body: |
            ## Replay Buffer v2 - הורד והפעל כמנהל מערכת
            - מקליט buffer אוטומטי מרגע ההפעלה
            - שמירה לא עוצרת את ההקלטה
            - עורך וידאו עם פיצול קטעים ותצוגה מקדימה
            - F11 למסך מלא בעורך
          files: dist/ReplayBuffer.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
