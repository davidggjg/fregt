name: Build ReplayBuffer EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller ReplayBuffer.spec

      - name: Verify output
        run: |
          dir dist\
          echo "Build complete!"

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReplayBuffer-Windows
          path: dist/ReplayBuffer.exe
          retention-days: 30

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "ReplayBuffer v1.0.${{ github.run_number }}"
          body: |
            ## Replay Buffer - הורד והפעל
            הורד את ReplayBuffer.exe והפעל כמנהל מערכת.
            הסרטונים נשמרים ב: Videos\ReplayBuffer
          files: dist/ReplayBuffer.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
